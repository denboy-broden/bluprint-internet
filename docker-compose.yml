services:
  mariadb:
    image: mariadb:10.11
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: rt_rw_net
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - rt-rw-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - rt-rw-net
    restart: unless-stopped

  laravel:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: rt-rw-api:latest
    container_name: rt-rw-api
    ports:
      - "8001:8001"
    volumes:
      - ./api:/var/www/html
    depends_on:
      - mariadb
      - redis
    networks:
      - rt-rw-net
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: rt_rw_net
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_HOST: redis
    restart: unless-stopped
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8001"

  frontend:
    image: node:20-alpine
    container_name: rt-rw-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8001/api"
    command: sh -c "npm run dev -- --port 3000 -H 0.0.0.0"
    depends_on:
      - laravel
    networks:
      - rt-rw-net
    restart: unless-stopped

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    image: rt-rw-ai-agent:latest
    container_name: rt-rw-ai-agent
    ports:
      - "8002:8000"
    environment:
      LARAVEL_API_URL: "http://rt-rw-api:8001/api"
    depends_on:
      - laravel
    networks:
      - rt-rw-net
    restart: unless-stopped

volumes:
  mariadb_data:

networks:
  rt-rw-net:
    driver: bridge

